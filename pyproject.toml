[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bcb-macro-lakehouse"
version = "0.1.0"
description = "Pipeline Medallion para dados macroeconômicos do Banco Central do Brasil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.20",
    "pyarrow>=15",
    "pydantic>=2.10",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".agents", ".venv", "data"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
